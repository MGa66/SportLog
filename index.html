<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SportLog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"><div class="loading">Lädt …</div></main>

  <div id="banner" class="banner hidden" data-a="banner"></div>
  <nav class="nav" id="nav"></nav>

  <div id="sheetWrap" class="sheet-wrap hidden">
    <div class="sheet-bg" data-a="closeSheet"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="toast" class="toast"></div>

  <input type="file" id="fileImport" multiple hidden>
  <input type="file" id="fileBackup" accept="application/json,.json" hidden>

  <script src="pictos.js"></script>
  <script src="app.js"></script>
</body>
</html>
